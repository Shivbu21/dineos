<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Order online</title>
<style>
/* dineos online ordering. One file, no framework, no web font — a customer
   on a phone waits for every kilobyte. Light theme only: warm paper, ink
   text, one confident deep-green accent. */
:root {
  --paper: #FAF7F1; --surface: #FFFFFF; --sunken: #F3EEE5;
  --border: #E8E0D2; --border-strong: #D8CCB4;
  --text: #211D16; --muted: #6B6257; --faint: #9A9081;
  --brand: #17603F; --brand-deep: #0F4A30; --brand-soft: #E3EFE7; --on-brand: #FFFFFF;
  --danger: #B3261E; --warn-bg: #FFF4E0; --warn-text: #8A5A00;
  --radius: 16px; --shadow: 0 1px 2px rgba(33,29,22,.07), 0 10px 30px rgba(33,29,22,.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 640px; margin: 0 auto; }
.pad { padding: 0 18px; }
.serif { font-family: Georgia, "Times New Roman", serif; }

.hero { padding: 26px 18px 14px; }
.hero .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--brand); }
.hero h1 { margin: 6px 0 2px; font-size: 30px; line-height: 1.15; letter-spacing: -.5px; }
.hero .sub { color: var(--muted); font-size: 14px; }
.controls { display: flex; gap: 8px; padding: 12px 18px 0; flex-wrap: wrap; }
.controls label { font-size: 12px; font-weight: 700; color: var(--muted); align-self: center; }
.controls select {
  font: inherit; font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  max-width: 200px;
}

.testbanner {
  margin: 0 18px 6px; padding: 10px 14px; border-radius: 12px;
  background: var(--warn-bg); color: var(--warn-text); font-size: 13px; font-weight: 600;
  border: 1px dashed var(--warn-text);
}

.type-toggle { display: flex; gap: 6px; padding: 12px 18px 4px; }
.type-toggle button {
  flex: 1; font: inherit; font-weight: 700; padding: 11px; border-radius: 12px; cursor: pointer;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
}
.type-toggle button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }

.search { padding: 10px 18px 2px; }
.search input {
  width: 100%; font: inherit; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}

nav { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 10px 0 8px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav .row { display: flex; gap: 8px; padding: 0 18px; width: max-content; }
nav button {
  font: inherit; font-weight: 600; white-space: nowrap; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
}
nav button[aria-selected="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

.card {
  display: flex; gap: 14px; width: 100%; text-align: left; font: inherit;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin: 0 18px 10px; width: calc(100% - 36px); cursor: pointer;
  box-shadow: var(--shadow);
}
.card:disabled { opacity: .55; cursor: default; box-shadow: none; }
.card img { width: 76px; height: 76px; object-fit: cover; border-radius: 12px; flex: none; background: var(--sunken); }
.card .grow { flex: 1; min-width: 0; }
.card .name { display: block; font-weight: 700; font-size: 16px; }
.card .desc { display: block; color: var(--muted); font-size: 13px; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--brand-deep); }
.card .soldout { font-size: 11px; font-weight: 700; letter-spacing: .4px; color: var(--danger); text-transform: uppercase; }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  transform: translateY(110%); transition: transform .25s ease;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: rgba(250,247,241,.92); backdrop-filter: blur(8px);
}
#bar.up { transform: none; }
#bar button {
  width: 100%; max-width: 640px; margin: 0 auto; display: flex;
  font: inherit; font-weight: 700; font-size: 16px; color: var(--on-brand);
  background: var(--brand); border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer;
  justify-content: space-between; align-items: center;
}
#bar button:active { background: var(--brand-deep); }

dialog { border: 0; border-radius: 20px 20px 0 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 640px;
  background: var(--paper); color: var(--text); max-height: 92dvh; }
dialog::backdrop { background: rgba(33,29,22,.45); }
.sheet-body { padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: 92dvh; }
.sheet-body h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.3px; }
.sheet-body .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
fieldset { border: 1px solid var(--border); border-radius: 12px; margin: 0 0 12px; padding: 10px 12px 12px; }
legend { font-weight: 700; font-size: 13px; padding: 0 6px; }
.req { color: var(--danger); font-size: 11px; margin-left: 6px; }
.optlbl { color: var(--faint); font-size: 11px; margin-left: 6px; font-weight: 400; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.opt-btn {
  font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--text);
}
.opt-btn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.opt-btn .delta { opacity: .75; font-weight: 400; margin-left: 4px; }
.field { display: block; margin: 12px 0 4px; font-weight: 700; font-size: 13px; }
input[type="text"], input[type="tel"], textarea {
  width: 100%; font: inherit; padding: 11px 13px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}
.qty { display: flex; align-items: center; gap: 16px; margin: 14px 0; }
.qty button {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: 20px; cursor: pointer; color: var(--text);
}
.qty span { font-size: 18px; font-weight: 700; min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.primary {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  font: inherit; font-weight: 700; font-size: 16px; color: var(--on-brand);
  background: var(--brand); border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer; margin-top: 6px;
}
.primary:disabled { opacity: .5; cursor: default; }
.primary:active:not(:disabled) { background: var(--brand-deep); }
.ghost {
  width: 100%; font: inherit; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; padding: 12px; cursor: pointer; margin-top: 2px;
}
.line { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.line .q { font-weight: 700; color: var(--brand-deep); min-width: 34px; }
.line .mods, .line .note { font-size: 12px; color: var(--muted); }
.line .tnum { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.line button { border: 0; background: none; color: var(--faint); font-size: 20px; cursor: pointer; padding: 0 2px; }
.total { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; padding: 12px 0 4px; }
.payopts { display: grid; gap: 8px; margin-top: 8px; }
.payopt {
  display: flex; align-items: center; gap: 12px; text-align: left; font: inherit;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; cursor: pointer;
}
.payopt[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.payopt .t { font-weight: 700; }
.payopt .d { font-size: 12px; color: var(--muted); }
#msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 20px; }
.done { text-align: center; padding: 30px 10px; }
.done .tick {
  width: 72px; height: 72px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-deep);
  font-size: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
}
.done .ordnum { font-size: 40px; font-weight: 800; letter-spacing: 2px; color: var(--brand-deep); margin: 8px 0; }
.foot { text-align: center; color: var(--faint); font-size: 12px; padding: 26px 18px 90px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="kicker" id="kicker"></div>
    <h1 class="serif" id="rname">…</h1>
    <div class="sub" id="rsub"></div>
  </div>
  <div class="controls">
    <span id="outletwrap" hidden><label for="outletsel" id="outletlbl"></label> <select id="outletsel"></select></span>
    <span><label for="langsel" id="langlbl"></label> <select id="langsel"></select></span>
  </div>
  <div class="testbanner" id="testbanner" hidden></div>

  <div class="type-toggle" role="group" id="typetoggle">
    <button id="t-pickup" aria-pressed="true"></button>
    <button id="t-delivery" aria-pressed="false"></button>
  </div>

  <div class="search"><input type="text" id="q" autocomplete="off"></div>
  <nav><div class="row" id="cats"></div></nav>
  <main id="menu" style="padding-top:6px"></main>
  <div class="foot" id="foot"></div>
</div>

<div id="bar"><button id="review"><span id="review-count"></span><span id="review-total"></span></button></div>

<dialog id="sheet"><div class="sheet-body" id="sheet-body"></div></dialog>

const $ = (id) => document.getElementById(id);
const showSheet = () => { const d = $("sheet"); if (!d.open) d.showModal(); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// --- language & outlet -------------------------------------------------------
// ?lang= overrides the remembered language; the switcher persists per device.
// ?outlet= overrides the remembered outlet; the picker persists per device.
const params = new URLSearchParams(location.search);
const LANGS = ["en", "hi", "ta", "te", "kn", "ml"];
const LANG_NAMES = { en: "English", hi: "हिन्दी", ta: "தமிழ்", te: "తెలుగు", kn: "ಕನ್ನಡ", ml: "മലയാളം" };

let lang = params.get("lang") || localStorage.getItem("dineos_lang") || "en";
if (!LANGS.includes(lang)) lang = "en";
let outletId = params.get("outlet") || localStorage.getItem("dineos_outlet") || null;

const t = (k) => (STRINGS[lang] && STRINGS[lang][k]) || STRINGS.en[k] || k;
const tf = (k, vars) => {
  let s = t(k);
  for (const key in vars) s = s.replace("{" + key + "}", vars[key]);
  return s;
};

const state = { cfg: null, menu: null, cart: [], type: "takeaway", cat: "all", sending: false };
let sym = "₹";

const money = (n) => sym + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
const lineTotal = (l) => (l.price + l.modifiers.reduce((s, m) => s + Number(m.price_delta || 0), 0)) * l.qty;
const cartTotal = () => state.cart.reduce((s, l) => s + lineTotal(l), 0);
const imgUrl = (item) => item.image ? "/api/files/menu_items/" + encodeURIComponent(item.id) + "/" + encodeURIComponent(item.image) : "";

async function okJson(res) {
  if (!res.ok) { let m = t("somethingWrong"); try { m = (await res.json()).message || m; } catch (e) {} throw new Error(m); }
  return res.json();
}

function renderStatic() {
  document.documentElement.lang = lang;
  document.title = t("orderOnline") + (state.cfg && state.cfg.restaurant ? " · " + state.cfg.restaurant.name : "");
  $("kicker").textContent = t("orderOnline");
  $("langlbl").textContent = t("language");
  $("outletlbl").textContent = t("chooseOutlet");
  $("t-pickup").textContent = t("pickup");
  $("t-delivery").textContent = t("delivery");
  $("typetoggle").setAttribute("aria-label", t("pickup") + " / " + t("delivery"));
  $("q").placeholder = t("searchMenu");
  $("foot").textContent = t("footer");
  if (state.cfg) {
    const r = state.cfg.restaurant || {};
    $("rname").textContent = r.name || t("orderOnline");
    $("rsub").textContent = t("pickupDelivery");
    $("testbanner").textContent = t("testMode");
  }
}

function buildLangSwitcher() {
  const sel = $("langsel");
  sel.innerHTML = LANGS.map((l) =>
    '<option value="' + l + '"' + (l === lang ? " selected" : "") + ">" + esc(LANG_NAMES[l]) + "</option>").join("");
  sel.onchange = () => {
    lang = sel.value;
    localStorage.setItem("dineos_lang", lang);
    if ($("sheet").open) $("sheet").close();
    renderStatic(); drawCats(); drawMenu(); syncBar();
  };
}

function buildOutletPicker() {
  const outlets = (state.cfg && state.cfg.outlets) || [];
  const wrap = $("outletwrap"), sel = $("outletsel");
  if (outlets.length < 2) { wrap.hidden = true; return; }
  wrap.hidden = false;
  // The remembered outlet may not exist (or be inactive) — fall back to first.
  if (!outlets.some((o) => o.id === outletId)) outletId = outlets[0].id;
  sel.innerHTML = outlets.map((o) =>
    '<option value="' + esc(o.id) + '"' + (o.id === outletId ? " selected" : "") + ">" + esc(o.name) + "</option>").join("");
  sel.onchange = () => {
    outletId = sel.value;
    localStorage.setItem("dineos_outlet", outletId);
    state.cart = []; state.cat = "all";
    loadMenu();
  };
}

async function loadMenu() {
  try {
    state.menu = await fetch("/api/app/menu" + (outletId ? "?outlet=" + encodeURIComponent(outletId) : "")).then(okJson);
  } catch (e) { $("rsub").textContent = t("menuUnavailable"); return; }
  const o = (state.cfg.outlets || []).find((x) => x.id === outletId);
  if (o && o.currency_symbol) sym = o.currency_symbol;
  renderStatic(); drawCats(); drawMenu(); syncBar();
}

async function init() {
  buildLangSwitcher();
  $("rsub").textContent = t("loadingMenu");
  renderStatic();
  try {
    state.cfg = await fetch("/api/app/online-config").then(okJson);
  } catch (e) { $("rsub").textContent = t("noServer"); return; }
  if (!state.cfg.enabled) {
    $("rname").textContent = t("orderingDisabled");
    $("rsub").textContent = t("disabledMsg");
    return;
  }
  const r = state.cfg.restaurant || {};
  sym = r.currency_symbol || "₹";
  if (state.cfg.test_mode) { $("testbanner").hidden = false; }
  buildOutletPicker();
  await loadMenu();
}

function drawCats() {
  if (!state.menu) return;
  const cats = [{ id: "all", name: t("all") }].concat(state.menu.categories);
  $("cats").innerHTML = cats.map((c) =>
    '<button data-cat="' + esc(c.id) + '" aria-selected="' + (state.cat === c.id) + '">' + esc(c.name) + "</button>").join("");
  $("cats").querySelectorAll("button").forEach((b) => {
    b.onclick = () => { state.cat = b.dataset.cat; drawCats(); drawMenu(); };
  });
}

function drawMenu() {
  if (!state.menu) return;
  const q = $("q").value.trim().toLowerCase();
  const items = state.menu.items.filter((i) =>
    (state.cat === "all" || i.category === state.cat) &&
    (!q || (i.name + " " + (i.description || "")).toLowerCase().includes(q)));
  $("menu").innerHTML = items.map((i) =>
    '<button class="card"' + (i.available ? "" : " disabled") + ' data-id="' + esc(i.id) + '">' +
    (i.image ? '<img src="' + esc(imgUrl(i)) + '" alt="" loading="lazy">' : "") +
    '<span class="grow"><span class="name">' + esc(i.name) +
    (i.available ? "" : '<span class="soldout"> · ' + esc(t("soldOut")) + "</span>") + "</span>" +
    (i.description ? '<span class="desc">' + esc(i.description) + "</span>" : "") +
    "</span>" +
    '<span class="price">' + money(i.price) + "</span></button>").join("") ||
    '<div class="pad" style="color:var(--muted);padding-top:20px">' + esc(t("noMatch")) + "</div>";
  $("menu").querySelectorAll(".card[data-id]").forEach((b) => { b.onclick = () => openItem(b.dataset.id); });
}

$("q").addEventListener("input", drawMenu);
$("t-pickup").onclick = () => setType("takeaway");
$("t-delivery").onclick = () => setType("delivery");
function setType(ty) {
  state.type = ty;
  $("t-pickup").setAttribute("aria-pressed", ty === "takeaway");
  $("t-delivery").setAttribute("aria-pressed", ty === "delivery");
}

function openItem(id) {
  const item = state.menu.items.find((i) => i.id === id);
  if (!item || !item.available) return;
  const groups = item.groups.map((gid) => state.menu.groups.find((g) => g.id === gid)).filter(Boolean);
  const picked = {}; let qty = 1;

  function draw() {
    const chosen = [];
    for (const g of groups) for (const mid of picked[g.id] || []) {
      const mod = g.modifiers.find((m) => m.id === mid); if (mod) chosen.push(mod);
    }
    const unit = item.price + chosen.reduce((s, m) => s + Number(m.price_delta || 0), 0);
    const missing = groups.find((g) => g.required && !(picked[g.id] || []).length);
    $("sheet-body").innerHTML =
      (item.image ? '<img src="' + esc(imgUrl(item)) + '" alt="" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:12px">' : "") +
      "<h2 class=\"serif\">" + esc(item.name) + "</h2>" +
      '<div class="sub">' + money(item.price) + (item.description ? " · " + esc(item.description) : "") + "</div>" +
      groups.map((g) =>
        "<fieldset><legend>" + esc(g.name) +
        (g.required ? '<span class="req">' + esc(t("required")) + "</span>"
                    : '<span class="optlbl">' + esc(t("optional")) + (g.max > 1 ? ", " + esc(tf("upToN", { n: g.max })) : "") + "</span>") +
        '</legend><div class="opts">' +
        g.modifiers.map((mo) =>
          '<button class="opt-btn" data-g="' + esc(g.id) + '" data-m="' + esc(mo.id) + '" aria-pressed="' + ((picked[g.id] || []).includes(mo.id)) + '">' +
          esc(mo.name) + (Number(mo.price_delta) ? '<span class="delta">' + (mo.price_delta > 0 ? "+" : "−") + money(Math.abs(mo.price_delta)).slice(sym.length) + "</span>" : "") +
          "</button>").join("") + "</div></fieldset>").join("") +
      '<label class="field" for="note">' + esc(t("kitchenNote")) + "</label>" +
      '<input type="text" id="note" maxlength="200" placeholder="' + esc(t("kitchenNotePh")) + '">' +
      '<div class="qty"><button id="minus" aria-label="' + esc(t("fewer")) + '">−</button>' +
      '<span id="q">' + qty + "</span>" +
      '<button id="plus" aria-label="' + esc(t("more")) + '">+</button></div>' +
      '<button class="primary" id="add"' + (missing ? " disabled" : "") + ">" +
      "<span>" + (missing ? esc(tf("chooseX", { name: missing.name })) : esc(t("addToOrder"))) + '</span><span>' + money(unit * qty) + "</span></button>" +
      '<button class="ghost" id="cancel">' + esc(t("cancel")) + "</button>";

    $("sheet-body").querySelectorAll(".opt-btn").forEach((b) => {
      b.onclick = () => {
        const g = groups.find((x) => x.id === b.dataset.g);
        const cur = picked[g.id] || []; const has = cur.includes(b.dataset.m);
        if (has) picked[g.id] = cur.filter((x) => x !== b.dataset.m);
        else if (g.max <= 1) picked[g.id] = [b.dataset.m];
        else if (cur.length < g.max) picked[g.id] = cur.concat(b.dataset.m);
        const note = $("note").value; draw(); $("note").value = note;
      };
    });
    $("minus").onclick = () => { if (qty > 1) { qty--; const n = $("note").value; draw(); $("note").value = n; } };
    $("plus").onclick = () => { if (qty < 20) { qty++; const n = $("note").value; draw(); $("note").value = n; } };
    $("cancel").onclick = () => $("sheet").close();
    $("add").onclick = () => {
      state.cart.push({ item_id: item.id, name: item.name, price: item.price, qty: qty,
        modifiers: chosen.map((m) => ({ id: m.id, name: m.name, price_delta: m.price_delta })),
        note: $("note").value.trim() });
      $("sheet").close(); syncBar();
    };
  }
  draw(); showSheet();
}

function syncBar() {
  const n = cartCount();
  $("bar").classList.toggle("up", n > 0);
  $("review-count").textContent = n === 1 ? t("reviewOne") : tf("reviewMany", { n: n });
  $("review-total").textContent = money(cartTotal());
}
$("review").onclick = checkout;

let payChoice = "counter";
function checkout() {
  if (!state.cart.length) return;
  const prov = state.cfg.providers || {};
  const online = [];
  if (prov.razorpay) online.push({ id: "razorpay", t: "Razorpay", d: t("upiCards") + (state.cfg.test_mode ? " · " + t("test") : "") });
  if (prov.stripe) online.push({ id: "stripe", t: "Card (Stripe)", d: t("cardStripe") + (state.cfg.test_mode ? " · " + t("test") : "") });
  payChoice = "counter";

  function drawPay() {
    $("sheet-body").innerHTML =
      "<h2>" + esc(t("checkout")) + "</h2>" +
      '<div class="sub">' + (state.type === "delivery" ? esc(t("delivery")) : esc(t("pickup"))) + " · " + esc(tf("itemsN", { n: cartCount() })) + "</div>" +
      state.cart.map((l, idx) =>
        '<div class="line"><span class="q">' + l.qty + "×</span><span style=\"flex:1\"><span>" + esc(l.name) + "</span>" +
        (l.modifiers.length ? '<div class="mods">' + esc(l.modifiers.map((m) => m.name).join(", ")) + "</div>" : "") +
        (l.note ? '<div class="note">' + esc(l.note) + "</div>" : "") +
        '</span><span class="tnum">' + money(lineTotal(l)) + '</span><button data-rm="' + idx + '" aria-label="' + esc(t("cancel")) + '">×</button></div>').join("") +
      '<div class="total"><span>' + esc(t("total")) + "</span><span>" + money(cartTotal()) + "</span></div>" +
      '<div class="sub">' + esc(t("taxIncluded")) + "</div>" +
      '<label class="field" for="cname">' + esc(t("yourName")) + '</label><input type="text" id="cname" maxlength="120" autocomplete="name" placeholder="' + esc(t("fullName")) + '">' +
      '<label class="field" for="cphone">' + esc(t("phone")) + '</label><input type="tel" id="cphone" maxlength="20" autocomplete="tel" placeholder="' + esc(t("phonePh")) + '">' +
      (state.type === "delivery" ? '<label class="field" for="addr">' + esc(t("deliveryAddress")) + '</label><textarea id="addr" rows="2" maxlength="500" placeholder="' + esc(t("addressPh")) + '"></textarea>' : "") +
      '<label class="field">' + esc(t("payment")) + '</label><div class="payopts">' +
      online.map((o) =>
        '<button class="payopt" data-pay="' + o.id + '" aria-pressed="' + (payChoice === o.id) + '">' +
        '<span style="flex:1"><span class="t">' + esc(o.t) + '</span><br><span class="d">' + esc(o.d) + "</span></span></button>").join("") +
      '<button class="payopt" data-pay="counter" aria-pressed="' + (payChoice === "counter") + '">' +
      '<span style="flex:1"><span class="t">' + esc(t("payAtCounter")) + '</span><br><span class="d">' +
      (state.type === "delivery" ? esc(t("cashOnDelivery")) : esc(t("cashAtPickup"))) + "</span></span></button></div>" +
      '<div id="msg"></div>' +
      '<button class="primary" id="place"><span>' + esc(t("placeOrder")) + "</span><span>" + money(cartTotal()) + "</span></button>" +
      '<button class="ghost" id="more">' + esc(t("keepBrowsing")) + "</button>";

    $("sheet-body").querySelectorAll("[data-rm]").forEach((b) => {
      b.onclick = () => { state.cart.splice(Number(b.dataset.rm), 1); syncBar(); if (state.cart.length) drawPay(); else $("sheet").close(); };
    });
    $("sheet-body").querySelectorAll("[data-pay]").forEach((b) => {
      b.onclick = () => { payChoice = b.dataset.pay; drawPay(); };
    });
    $("more").onclick = () => $("sheet").close();
    $("place").onclick = placeOrder;
  }
  drawPay(); showSheet();
}

async function placeOrder() {
  if (state.sending) return;
  const name = $("cname").value.trim(), phone = $("cphone").value.trim();
  const addrEl = $("addr"); const address = addrEl ? addrEl.value.trim() : "";
  const msg = (tx) => { $("msg").textContent = tx || ""; };
  if (!name) { msg(t("needName")); return; }
  if (phone.replace(/\D/g, "").length < 6) { msg(t("needPhone")); return; }
  if (state.type === "delivery" && address.length < 4) { msg(t("needAddress")); return; }
  msg(""); state.sending = true;

  const payload = {
    items: state.cart.map((l) => ({ item_id: l.item_id, qty: l.qty, modifiers: l.modifiers.map((m) => m.id), note: l.note })),
    customer_name: name, customer_phone: phone, type: state.type, address: address,
    payment: payChoice === "counter" ? "counter" : "online",
    provider: payChoice === "counter" ? undefined : payChoice,
    outlet: outletId || undefined,
  };
  let res;
  try { res = await fetch("/api/app/online-order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(okJson); }
  catch (e) { state.sending = false; msg(e.message); return; }
  state.sending = false;

  if (res.payment.mode === "counter") return done(res, tf(state.type === "delivery" ? "payOnDelivery" : "payAtPickup", { total: money(res.total) }));
  if (res.payment.provider === "razorpay") return payRazorpay(res);
  if (res.payment.provider === "stripe") return payStripe(res);
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="' + src + '"]')) return resolve();
    const s = document.createElement("script"); s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function payRazorpay(res) {
  try { await loadScript("https://checkout.razorpay.com/v1/checkout.js"); }
  catch (e) { return done(res, t("payFormFailed"), true); }
  const p = res.payment;
  const rzp = new Razorpay({
    key: p.key_id, order_id: p.gateway_id, amount: p.amount, currency: p.currency,
    name: state.cfg.restaurant.name, description: "Order " + res.order_number,
    theme: { color: "#17603F" },
    handler: () => done(res, t("payReceived")),
    modal: { ondismiss: () => done(res, t("payIncomplete"), true) },
  });
  rzp.open();
}

async function payStripe(res) {
  try { await loadScript("https://js.stripe.com/v3/"); }
  catch (e) { return done(res, t("payFormFailed"), true); }
  const p = res.payment;
  $("sheet-body").innerHTML =
    "<h2>" + esc(t("cardPayment")) + "</h2>" +
    '<div class="sub">Order ' + esc(res.order_number) + " · " + money(res.total) + (p.test ? " · " + esc(t("test")) : "") + "</div>" +
    '<div id="card-el" style="padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)"></div>' +
    '<div id="msg"></div>' +
    '<button class="primary" id="paynow"><span>' + esc(t("payNow")) + "</span><span>" + money(res.total) + "</span></button>" +
    '<button class="ghost" id="back">' + esc(t("back")) + "</button>";
  const stripe = Stripe(p.publishable_key);
  const elements = stripe.elements();
  const card = elements.create("card"); card.mount("#card-el");
  $("back").onclick = () => checkout();
  $("paynow").onclick = async () => {
    const msg = (tx) => { $("msg").textContent = tx || ""; };
    msg(t("processing"));
    const out = await stripe.confirmCardPayment(p.client_secret, { payment_method: { card: card } });
    if (out.error) { msg(out.error.message); return; }
    done(res, t("payReceived"));
  };
}

function done(res, note, warn) {
  state.cart = []; syncBar();
  $("sheet-body").innerHTML =
    '<div class="done"><div class="tick">✓</div>' +
    "<h2 class=\"serif\">" + esc(t("orderPlaced")) + "</h2>" +
    '<div class="ordnum">' + esc(res.order_number) + "</div>" +
    '<div class="sub">' + esc(note) + "</div>" +
    (warn ? '<div class="sub">' + esc(t("showOrderNum")) + "</div>" : "") +
    '<button class="primary" id="ok"><span style="margin:0 auto">' + esc(t("done")) + "</span></button></div>";
  $("ok").onclick = () => { $("sheet").close(); drawMenu(); };
  showSheet();
}

init();
</script>
</body>
